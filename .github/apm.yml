---
# APM Configuration (Agent Package Manager)
# Defines project structure, scripts, dependencies, and context windows for agentic workflows

version: "1.0"
name: "AgenticAI.DotNet"
description: "Agentic primitives framework for reliable AI workflows - .NET 10 Edition"
author: "Your Team"
language: "C#"
runtime: ".NET 10"

# Development Scripts
scripts:
  # Core development
  dev: "dotnet build"
  build: "dotnet build --configuration Release"
  test: "dotnet test"
  lint: "dotnet format --verify-no-changes"
  format: "dotnet format"
  
  # Testing variants
  test:unit: "dotnet test --filter Category=Unit"
  test:integration: "dotnet test --filter Category=Integration"
  test:coverage: "dotnet test /p:CollectCoverage=true /p:CoverageFormat=opencover"
  
  # Database
  db:migrate: "dotnet ef database update"
  db:seed: "dotnet ef database drop -f && dotnet ef database update"
  db:reset: "dotnet ef database drop -f && dotnet ef database update"
  
  # Documentation
  docs: "dotnet build -c Release /p:GenerateDocumentationFile=true"
  docs:serve: "start-static-server docs/"

# Dependencies by category
dependencies:
  required:
    - dotnet: ">= 10.0.0"
  optional:
    - docker: ">= 20.0.0"
    - postgresql: ">= 13.0"
    - sql-server: ">= 2019"
    - redis: ">= 6.0"
  nuget:
    - CSharpFunctionalExtensions: "^2.41"
    - SonarAnalyzer.CSharp: "^9.0"
    - Microsoft.CodeAnalysis.NetAnalyzers: "^8.0"
    - Meziantou.Analyzer: "^0.0"
    - xunit: "^2.6"
    - xunit.runner.visualstudio: "^2.5"
    - Moq: "^4.20"
    - FluentAssertions: "^6.12"

# Context Windows for Different Roles
context-windows:
  architect:
    max_tokens: 8000
    focus: "Planning, design, specification"
    session_duration: "30-45 min"
    tools: ["codebase", "search", "problems"]
    
  developer:
    max_tokens: 12000
    focus: "Implementation, testing, debugging"
    session_duration: "60-90 min"
    tools: ["codebase", "search", "editFiles", "runCommands", "problems"]
    
  reviewer:
    max_tokens: 8000
    focus: "Code quality, security, patterns"
    session_duration: "30-45 min"
    tools: ["codebase", "search", "problems"]

# Inner/Outer Loop Configuration
inner-loop:
  # Single developer, single session
  # Use these settings for focused implementation work
  description: "Developer mode - full access within session"
  session_mode: "streaming"
  iteration_time: "20-30 minutes"
  scope: "Single component/feature"
  tools_allowed: ["all_safe_tools"]

outer-loop:
  # Full team, orchestrated workflow across sessions
  # Use development-cycle.prompt.md for orchestration
  description: "Team mode - coordinated phases with handoffs"
  session_mode: "discrete_phases"
  phase_duration: "30-45 minutes each"
  phases:
    - "Architect (Phase 1)"
    - "Developer (Phase 2)"
    - "Reviewer (Phase 3)"
    - "Iterate (Phase 4, if needed)"
    - "Verify (Phase 5)"
  sync_points: []
  auto_advance: true
  unattended: true

# MCP (Model Context Protocol) Configuration
mcp:
  enabled: true
  security_level: "strict"
  allowed_protocols:
    - github: "Repository and issue access"
    - filesystem: "Safe file operations only"
    - shell: "Sandboxed command execution"
    - context7: "Library documentation and code snippets"

# Context7 MCP Server
# Provides up-to-date documentation and code examples for any library
# Usage: @dev "How do I use Railway-Oriented Programming?" → Fetches latest CSharpFunctionalExtensions docs
context7:
  enabled: true
  purpose: "Real-time library documentation and code snippet lookup"
  libraries:
    - csharp: "C# language features and patterns"
    - dotnet: ".NET runtime and framework"
    - "csharp-functional-extensions": "Railway-Oriented Programming library"
    - "entity-framework-core": "ORM for database access"
    - xunit: "Unit testing framework"
    - moq: "Mocking library"
    - "sonarqube": "Code quality analysis"
  features:
    - library_search: "Find documentation for any NuGet package"
    - code_examples: "Get working C# code snippets"
    - api_reference: "Browse API documentation"
    - version_support: "Access specific library versions"
  use_cases:
    - architect: "Research library capabilities during design"
    - developer: "Look up API docs while implementing"
    - reviewer: "Check for best practices and patterns"

# Project Structure
structure:
  source: "src/"
  tests: "tests/"
  docs: "docs/"
  specs: "docs/specs/"
  github_config: ".github/"
  config_files:
    - ".csproj"
    - "appsettings.json"
    - ".env.example"
    - "global.json"

# Specification Template Reference
spec:
  template: "docs/specs/_template.spec.md"
  required_sections:
    - "Problem Statement"
    - "Functional Requirements"
    - "Technical Design"
    - "Implementation Plan"
    - "Acceptance Criteria"
    - "Risks & Mitigations"

# Memory Configuration
memory:
  file: ".memory.md"
  update_frequency: "Per phase completion"
  sections_maintained:
    - "Project Context"
    - "Important Patterns"
    - "Failed Approaches (Don't Repeat)"
    - "Known Issues & Quirks"
    - "Critical Success Factors"
    - "External Dependencies"
    - "Session Memory"

# Quality Gates
quality-gates:
  phase1:
    - "Specification complete and approved"
    - "Architecture diagram created"
    - "Task breakdown estimated"
  phase2:
    - "Tests written and failing (Red)"
    - "Code implemented (Green)"
    - "Code refactored (Blue)"
    - "All acceptance criteria passing"
  phase3:
    - "Security review passed"
    - "Performance acceptable"
    - "Clean Architecture compliance verified"
  phase5:
    - "Static analysis: PASS"
    - "Unit tests: PASS"
    - "Integration tests: PASS"
    - "Build: PASS"
    - "Runtime verification: PASS"

# Deployment Configuration
deployment:
  target_environments: ["development", "staging", "production"]
  rollout_strategy: "blue-green"
  rollback_enabled: true
  notification_channels: ["slack", "email"]

# Monitoring & Observability
monitoring:
  enabled: true
  error_tracking: "Sentry"
  performance: "DataDog"
  logs: "CloudWatch"
  dashboards:
    - "Application Health"
    - "Error Rates"
    - "Performance Metrics"
